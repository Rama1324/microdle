<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_NAME% — juegos diarios chilenos</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121414" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME% — juegos diarios chilenos" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_NAME% — juegos diarios chilenos" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- theme-script -->
  </head>
  <body>
    <header class="top">
      <div class="top-side"></div>
      <h1 class="brand">%SITE_NAME%</h1>
      <div class="top-side right">
        <button type="button" class="icon-btn" id="btn-theme" aria-label="Cambiar tema"></button>
      </div>
    </header>

    <main class="hub">
      <p class="hub-intro">%SITE_DESCRIPTION%</p>
      <div class="hub-streak" id="hub-streak" aria-live="polite"></div>
      <ul class="hub-cards" id="hub-cards" aria-label="Juegos"></ul>
    </main>

    <footer class="foot">
      <p>Proyecto independiente. Microdle no tiene afiliación con DTPM ni Red Movilidad. Datos: GTFS DTPM, mapas © OpenStreetMap / CARTO.</p>
    </footer>

    <script type="module" src="/src/hub/main.ts"></script>
  </body>
</html>
